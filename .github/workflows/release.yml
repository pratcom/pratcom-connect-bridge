name: Build premium & attach plugin zip (canal GitHub/PUC)

# A chaque release publiee sur GitHub, construit un .zip complet du plugin
# (avec le dossier vendor/ resolu par Composer) et le joint a la release.
# C'est ce .zip que le Plugin Update Checker telecharge (enableReleaseAssets).
# Sans cet asset, WordPress installe un paquet incomplet -> erreur fatale.
#
# NOTE (incident v2.0.3) : un tag "v.2.0.3" (typo) a fait echouer le guard
# et la release est restee sans zip premium. Le guard normalise maintenant
# les prefixes "v" et "v." avant comparaison. Le numero doit toujours
# correspondre au header/constante (lecon 5).
#
# Release reproductible (E-16) :
# - composer.lock est versionne ; l'installation ECHOUE s'il manque ou s'il
#   diverge de composer.json (composer validate --strict). Le vendor/ du zip
#   ne depend donc plus du jour de la release.
# - chaque action tierce est epinglee par SHA complet (version en commentaire) ;
#   tests/verifier-outillage-release.php le controle en CI.
# - l'empreinte SHA-256 du zip est publiee a cote (pratcom-connect-bridge.zip.sha256).
# - deux travaux : "build" n'a que la lecture du depot (Composer y tourne),
#   "publier" a seul le droit d'ecrire sur la release.
#
# ATTENTION ordre des assets : PUC (enableReleaseAssets() sans filtre) prend
# le PREMIER asset de la release. Le zip est donc joint dans une etape a part,
# AVANT l'empreinte. Ne pas fusionner les deux etapes en une seule liste.

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verifier header et constante == tag (lecon 5)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#.}"
          HEADER=$(grep -oP '^\s\*\s*Version:\s*\K\S+' pratcom-connect-bridge.php)
          CONST=$(grep -oP "define\('PRATCOM_CONNECT_BRIDGE_VERSION',\s*'\K[^']+" pratcom-connect-bridge.php)
          echo "tag=$TAG header=$HEADER constante=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Incoherence version : tag=$TAG header=$HEADER constante=$CONST (lecon 5 - jamais de release incoherente)"
            exit 1
          fi

      - name: Setup PHP 8.1 + Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          tools: composer

      - name: Verrou Composer present et a jour (E-16)
        run: |
          test -f composer.lock || { echo "::error::composer.lock absent : release non reproductible"; exit 1; }
          # --no-check-all : la contrainte exacte de plugin-update-checker est
          # voulue (epinglage). Le controle du verrou, lui, reste strict.
          composer validate --strict --no-check-all

      - name: Install production dependencies (with vendor/)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Assemble plugin folder
        run: |
          mkdir -p build/pratcom-connect-bridge
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='tests' \
            --exclude='.gitignore' \
            --exclude='composer.lock' \
            --exclude='.wordpress-org' \
            ./ build/pratcom-connect-bridge/

      - name: Create zip
        run: |
          cd build
          zip -r pratcom-connect-bridge.zip pratcom-connect-bridge

      - name: Empreinte SHA-256 du zip
        run: |
          cd build
          sha256sum pratcom-connect-bridge.zip > pratcom-connect-bridge.zip.sha256
          cat pratcom-connect-bridge.zip.sha256
          sha256sum -c pratcom-connect-bridge.zip.sha256

      - name: Transmettre le zip et son empreinte au travail de publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pratcom-connect-bridge-release
          path: |
            build/pratcom-connect-bridge.zip
            build/pratcom-connect-bridge.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publier:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Recuperer le zip et son empreinte
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pratcom-connect-bridge-release
          path: build

      - name: Reverifier l'empreinte avant publication
        run: |
          cd build
          sha256sum -c pratcom-connect-bridge.zip.sha256

      - name: Attach zip to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: build/pratcom-connect-bridge.zip

      - name: Joindre l'empreinte SHA-256 (apres le zip, voir ATTENTION en tete)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: build/pratcom-connect-bridge.zip.sha256
