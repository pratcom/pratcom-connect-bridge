name: Build premium & attach plugin zip (canal GitHub/PUC)

# A chaque tag vX.Y.Z pousse, construit un .zip complet du plugin (avec le
# dossier vendor/ resolu par Composer), CREE la release en brouillon, y joint
# le zip, reverifie l'empreinte de l'asset telecharge, puis PUBLIE la release.
# C'est ce .zip que le Plugin Update Checker telecharge (enableReleaseAssets).
# Sans cet asset, WordPress installe un paquet incomplet -> erreur fatale.
#
# Aucune fenetre sans asset (R1, 27/11) : avant, le workflow partait sur
# `release: published`, la release etait donc publique quelques minutes SANS
# zip. Un site en 2.2.2 (PUC 5.7, enableReleaseAssets() sans motif) qui
# verifiait dans cette fenetre prenait zipball_url, l'archive source sans
# vendor/, et ne se mettait plus jamais a jour. Un brouillon est invisible de
# PUC (/releases/latest ignore les brouillons) : la release ne devient
# publique qu'avec son zip joint et verifie. Ne jamais creer ni publier la
# release a la main : garde-release.yml remet en brouillon une release
# publiee sans son seul zip. Relance a la main : Actions, ce workflow,
# "Run workflow" sur le tag (un brouillon existant est repris).
#
# NOTE (incident v2.0.3) : un tag "v.2.0.3" (typo) a fait echouer le guard
# et la release est restee sans zip premium. Le guard normalise maintenant
# les prefixes "v" et "v." avant comparaison. Le numero doit toujours
# correspondre au header/constante (lecon 5).
#
# Release reproductible (E-16) :
# - composer.lock est versionne ; l'installation ECHOUE s'il manque ou s'il
#   diverge de composer.json (composer validate --strict). Le vendor/ du zip
#   ne depend donc plus du jour de la release.
# - chaque action tierce est epinglee par SHA complet (version en commentaire) ;
#   tests/verifier-outillage-release.php le controle en CI.
# - l'empreinte SHA-256 du zip est calculee, reverifiee avant publication et
#   ecrite dans les notes de la release (E-34 : plus comme asset, voir plus bas).
# - deux travaux : "build" n'a que la lecture du depot (Composer y tourne),
#   "publier" a seul le droit d'ecrire sur la release.
#
# Asset designe (E-28) : Updater.php de main appelle enableReleaseAssets()
# avec le motif /^pratcom-connect-bridge\.zip$/ (REQUIRE). Ne pas renommer le
# zip sans changer le motif.
#
# Un seul asset (E-34, 27/11) : la release qui suit 2.2.2 est choisie par le
# Updater.php de 2.2.2, deja installe chez les clients, qui appelle
# enableReleaseAssets() SANS motif : Plugin Update Checker y prend le premier
# asset de la release, quel qu'il soit (zip .org, empreinte .sha256). La
# release publique ne porte donc QUE pratcom-connect-bridge.zip : le zip .org
# reste un artefact de build-org.yml, l'empreinte va dans les notes.
# tests/verifier-outillage-release.php refuse tout autre asset.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

# Deux passages sur le meme tag ne se croisent pas.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Lance sur un tag (jamais sur une branche)
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::release.yml se lance sur un tag vX.Y.Z, pas sur $GITHUB_REF_NAME"; exit 1; }

      - name: Verifier header et constante == tag (lecon 5)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#.}"
          HEADER=$(grep -oP '^\s\*\s*Version:\s*\K\S+' pratcom-connect-bridge.php)
          CONST=$(grep -oP "define\('PRATCOM_CONNECT_BRIDGE_VERSION',\s*'\K[^']+" pratcom-connect-bridge.php)
          echo "tag=$TAG header=$HEADER constante=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Incoherence version : tag=$TAG header=$HEADER constante=$CONST (lecon 5 - jamais de release incoherente)"
            exit 1
          fi

      - name: Setup PHP 8.1 + Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          tools: composer

      - name: Verrou Composer present et a jour (E-16)
        run: |
          test -f composer.lock || { echo "::error::composer.lock absent : release non reproductible"; exit 1; }
          # --no-check-all : la contrainte exacte de plugin-update-checker est
          # voulue (epinglage). Le controle du verrou, lui, reste strict.
          composer validate --strict --no-check-all

      - name: Install production dependencies (with vendor/)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Assemble plugin folder
        run: |
          mkdir -p build/pratcom-connect-bridge
          # M-41 : memes exclusions que build-org.yml, sauf vendor/ (le zip
          # premium embarque Plugin Update Checker). Ni CLAUDE.md, ni docs/,
          # ni composer.json dans le zip ; tests/verifier-outillage-release.php
          # compare les deux listes.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='.gitignore' \
            --exclude='.distignore' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='*.md' \
            --exclude='.wordpress-org' \
            ./ build/pratcom-connect-bridge/

      - name: Create zip
        run: |
          cd build
          zip -r pratcom-connect-bridge.zip pratcom-connect-bridge

      - name: Empreinte SHA-256 du zip
        run: |
          cd build
          sha256sum pratcom-connect-bridge.zip > pratcom-connect-bridge.zip.sha256
          cat pratcom-connect-bridge.zip.sha256
          sha256sum -c pratcom-connect-bridge.zip.sha256

      # Notes de la version : docs/notes-release/<version>.md s'il existe
      # (docs/ est exclu du zip). L'empreinte s'y ajoute a la publication.
      - name: Notes de la version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#.}"
          if [ -f "docs/notes-release/${VERSION}.md" ]; then
            cp "docs/notes-release/${VERSION}.md" build/notes-version.md
          else
            echo "::warning::docs/notes-release/${VERSION}.md absent : notes reduites a l'empreinte"
            : > build/notes-version.md
          fi

      - name: Transmettre le zip et son empreinte au travail de publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pratcom-connect-bridge-release
          path: |
            build/pratcom-connect-bridge.zip
            build/pratcom-connect-bridge.zip.sha256
            build/notes-version.md
          if-no-files-found: error
          retention-days: 7

  publier:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Recuperer le zip et son empreinte
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pratcom-connect-bridge-release
          path: build

      - name: Reverifier l'empreinte avant publication
        run: |
          cd build
          sha256sum -c pratcom-connect-bridge.zip.sha256

      # E-34 : aucun second asset. L'empreinte va dans les notes.
      - name: Notes de la release (notes de la version, puis empreinte SHA-256)
        run: |
          set -euo pipefail
          ligne=$(cat build/pratcom-connect-bridge.zip.sha256)
          echo "$ligne" | grep -Eq '^[0-9a-f]{64}  pratcom-connect-bridge\.zip$' || { echo "::error::empreinte illisible"; exit 1; }
          { cat build/notes-version.md; printf '\nSHA-256 : `%s`\n' "$ligne"; } > build/notes.md
          cat build/notes.md

      # Brouillon : invisible du Plugin Update Checker. Un brouillon deja la
      # (relance) est repris ; une release deja publique arrete tout.
      - name: Creer la release en brouillon
        run: |
          set -euo pipefail
          if brouillon=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$brouillon" != "true" ]; then
              echo "::error::la release $TAG est deja publique (creee a la main ?). garde-release.yml la remet en brouillon ; relancez ensuite ce workflow sur le tag."
              exit 1
            fi
            echo "brouillon existant repris"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file build/notes.md
          fi

      - name: Joindre le zip au brouillon (seul asset)
        run: gh release upload "$TAG" build/pratcom-connect-bridge.zip --clobber

      - name: Verifier le brouillon (un seul asset, le bon zip, la bonne empreinte)
        run: |
          set -euo pipefail
          etat=$(gh release view "$TAG" --json isDraft,assets --jq '[(.isDraft | tostring)] + (.assets | map(.name)) | join(",")')
          echo "etat=$etat"
          [ "$etat" = "true,pratcom-connect-bridge.zip" ] || { echo "::error::brouillon inattendu ($etat) : rien n'est publie"; exit 1; }
          mkdir -p verif
          gh release download "$TAG" --pattern pratcom-connect-bridge.zip --dir verif --clobber
          cd verif
          sha256sum -c ../build/pratcom-connect-bridge.zip.sha256

      - name: Publier la release (asset joint et verifie)
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest --notes-file build/notes.md
          etat=$(gh release view "$TAG" --json isDraft,assets --jq '[(.isDraft | tostring)] + (.assets | map(.name)) | join(",")')
          echo "etat=$etat"
          [ "$etat" = "false,pratcom-connect-bridge.zip" ] || { echo "::error::release publiee dans un etat inattendu ($etat)"; exit 1; }
