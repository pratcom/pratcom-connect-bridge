name: Build variante WordPress.org

# Produit le zip de la variante .org : slug pratcom-connect, canal 'org',
# SANS Plugin Update Checker (interdit sur WP.org, lecon #10) et sans
# vendor/ (l'autoloader PSR-4 maison du fichier principal suffit).
# Declenchement manuel (preparation de soumission / mise a jour SVN) ou
# sur release publiee (artifact joint pour archive).

on:
  workflow_dispatch:
  release:
    types: [published]

# E-22 (12/11) : rien au niveau du fichier. Le travail qui construit (et lance
# wp-cli, un binaire tiers) n a que la lecture ; l ecriture de la release vit
# dans un seul travail, qui ne lance que gh, sans extraction du depot.
permissions: {}

jobs:
  build-org:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'

      - name: Verifier header == constante (lecon 5)
        run: |
          HEADER=$(grep -oP '^\s\*\s*Version:\s*\K\S+' pratcom-connect-bridge.php)
          CONST=$(grep -oP "define\('PRATCOM_CONNECT_BRIDGE_VERSION',\s*'\K[^']+" pratcom-connect-bridge.php)
          [ -n "$HEADER" ] && [ "$HEADER" = "$CONST" ] || { echo "::error::header=$HEADER constante=$CONST"; exit 1; }

      - name: Basculer le canal sur 'org' (1 ligne, verifiee)
        run: |
          sed -i "s/define('PRATCOM_CONNECT_BRIDGE_CHANNEL', 'premium');/define('PRATCOM_CONNECT_BRIDGE_CHANNEL', 'org');/" pratcom-connect-bridge.php
          grep -q "define('PRATCOM_CONNECT_BRIDGE_CHANNEL', 'org');" pratcom-connect-bridge.php || { echo "::error::bascule canal echouee"; exit 1; }

      - name: Retirer le Plugin Update Checker (interdit .org)
        run: rm -f src/Updater.php

      - name: Compiler les traductions (.po -> .mo) via WP-CLI
        run: |
          set -e
          # E-22 : version figee et empreinte sha256 verifiee AVANT toute
          # execution. Empreinte publiee par wp-cli avec la release v2.12.0
          # (wp-cli-2.12.0.phar.sha256), recalculee a l identique le 12/11.
          # Une autre empreinte arrete le build ; monter de version = changer
          # les deux lignes ensemble.
          WP_CLI_VERSION=2.12.0
          WP_CLI_SHA256=ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
          curl -sSfL -o wp-cli.phar "https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}/wp-cli-${WP_CLI_VERSION}.phar"
          echo "${WP_CLI_SHA256}  wp-cli.phar" | sha256sum -c - || { echo "::error::empreinte de wp-cli.phar differente, build arrete"; exit 1; }
          php wp-cli.phar --info >/dev/null
          # Genere les .mo (et .l10n.php) a partir des .po committes (FR source,
          # traductions EN). Outil officiel WordPress, deterministe, sans gettext.
          php wp-cli.phar i18n make-mo languages languages
          ls languages/*.mo

      - name: Assembler le dossier du plugin (slug pratcom-connect)
        run: |
          mkdir -p build/pratcom-connect
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='.gitignore' \
            --exclude='.distignore' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='vendor' \
            --exclude='*.md' \
            --exclude='.wordpress-org' \
            ./ build/pratcom-connect/

      - name: Garde-fous .org (zero PUC, zero Updater, canal org)
        run: |
          set -e
          ! grep -ri "plugin-update-checker" build/pratcom-connect
          ! grep -ri "PucFactory" build/pratcom-connect
          test ! -f build/pratcom-connect/src/Updater.php
          grep -q "define('PRATCOM_CONNECT_BRIDGE_CHANNEL', 'org');" build/pratcom-connect/pratcom-connect-bridge.php
          # Aucune iframe d'app tierce dans le build .org : la garde de canal doit
          # rester presente dans les 3 onglets concernes (revue WordPress.org).
          grep -q "PRATCOM_CONNECT_BRIDGE_CHANNEL === 'org'" build/pratcom-connect/src/Admin/Tabs/ChatTab.php
          grep -q "PRATCOM_CONNECT_BRIDGE_CHANNEL === 'org'" build/pratcom-connect/src/Admin/Tabs/FormsTab.php
          grep -q "PRATCOM_CONNECT_BRIDGE_CHANNEL === 'org'" build/pratcom-connect/src/Admin/Tabs/PrivacyTab.php
          # Le dossier d'assets WordPress.org ne doit jamais entrer dans le zip.
          test ! -d build/pratcom-connect/.wordpress-org
          # Les traductions doivent etre embarquees : dossier languages/ avec au
          # moins un .mo compile (sinon l'admin n'est pas traduit dans le zip).
          test -d build/pratcom-connect/languages && ls build/pratcom-connect/languages/*.mo
          php -l build/pratcom-connect/pratcom-connect-bridge.php

      - name: Zip
        run: |
          cd build
          zip -rq pratcom-connect-org.zip pratcom-connect

      - name: Publier l'artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pratcom-connect-org
          path: build/pratcom-connect-org.zip

  # Seul travail en ecriture : aucune extraction, aucune action tierce, aucun
  # binaire telecharge. gh (installe sur le runner) recupere l artefact du
  # travail precedent et le joint a la release.
  joindre-release:
    needs: build-org
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Joindre le zip .org a la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pratcom-connect-org --dir build
          gh release upload "$TAG" build/pratcom-connect-org.zip --repo "$GITHUB_REPOSITORY" --clobber
